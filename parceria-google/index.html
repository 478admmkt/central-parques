<title>Central da Parceria Google</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Central de gestão das recomendações do Google para Aquário de São Paulo, Animália Park e Cidade da Criança.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Poppins:wght@500;600;700&display=swap">
<style>/* Layout: faixa escura da marca 478 (losangos concêntricos) + barra fixa de parques/seções; conteúdo em grade de painéis claros. */
/* Tokens do Manual de Marca 478 (Design System "Manual de Marca 478"): fundo, superficie, linha, texto, destaque, chanfro. */
:root{
  --bg:#f7f7f7; --surface:#ffffff; --surface-2:#f3f4f7; --surface-3:#eceef4;
  --ink:#01032c; --ink-2:#2f3658; --muted:#616c90; --line:#dedfe6; --line-2:#7c86a6;
  --brand:#0c25a3; --brand-2:#2a43c4; --on-brand:#ffffff; --brand-soft:#e8ecfb; --accent:#0dea9b; --accent-ink:#047a50; --accent-soft:#dcfbef;
  --danger:#c8323f; --danger-soft:#fdecee; --warn:#9a6200; --warn-soft:#fff3db;
  --s-pendente:#8d95b3; --s-analise:#c98a12; --s-planejada:#5c78ec; --s-andamento:#0c25a3; --s-aplicada:#0bbf80; --s-descartada:#4a4f68;
  --shadow:0 1px 2px #01032c14,0 2px 8px #01032c0f; --shadow-2:0 8px 24px #01032c1f; --focus:#0c25a3;
  --band-1:#010318; --band-ink:#ffffff; --band-muted:#a7aecb; --band-line:rgba(255,255,255,.14);
  --font-display:"Poppins","Segoe UI",system-ui,sans-serif; --font-text:"DM Sans",system-ui,sans-serif;
  --r-sm:4px; --r-md:8px; --r-lg:8px; --chanfro:16px;
}
@media (prefers-color-scheme:dark){:root.sem-tema-escuro{
  --bg:#010318; --surface:#08103f; --surface-2:#0d1650; --surface-3:#141d5e;
  --ink:#f3f4f7; --ink-2:#cdd2ea; --muted:#a7aecb; --line:#232a5c; --line-2:#6d77a8;
  --brand:#0dea9b; --brand-2:#4ef2b8; --on-brand:#01032c; --brand-soft:#132061; --accent:#0dea9b; --accent-ink:#0dea9b; --accent-soft:#0b3a3a;
  --danger:#ff7682; --danger-soft:#3a1027; --warn:#f2b545; --warn-soft:#3a2a0a;
  --s-pendente:#7d86ad; --s-analise:#f2b545; --s-planejada:#7f97ff; --s-andamento:#4f6bff; --s-aplicada:#0dea9b; --s-descartada:#6b7196;
  --shadow:0 1px 2px #00000099; --shadow-2:0 12px 32px #000000b3; --focus:#0dea9b; color-scheme:dark}}
:root.sem-tema-escuro-2{
  --bg:#010318; --surface:#08103f; --surface-2:#0d1650; --surface-3:#141d5e;
  --ink:#f3f4f7; --ink-2:#cdd2ea; --muted:#a7aecb; --line:#232a5c; --line-2:#6d77a8;
  --brand:#0dea9b; --brand-2:#4ef2b8; --on-brand:#01032c; --brand-soft:#132061; --accent:#0dea9b; --accent-ink:#0dea9b; --accent-soft:#0b3a3a;
  --danger:#ff7682; --danger-soft:#3a1027; --warn:#f2b545; --warn-soft:#3a2a0a;
  --s-pendente:#7d86ad; --s-analise:#f2b545; --s-planejada:#7f97ff; --s-andamento:#4f6bff; --s-aplicada:#0dea9b; --s-descartada:#6b7196;
  --shadow:0 1px 2px #00000099; --shadow-2:0 12px 32px #000000b3; --focus:#0dea9b; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-text);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--band-1)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num,.tab-num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- faixa da marca ---------- */
.band{position:relative;overflow:hidden;color:var(--band-ink);background:radial-gradient(45% 80% at 92% 100%,#0a5a5a 0%,#01031800 70%),linear-gradient(135deg,#0c2195 0%,#050f4d 35%,#010318 75%)}
.band svg.diamonds{position:absolute;right:-60px;top:-40px;height:150%;opacity:.55;pointer-events:none}
.band .wrap{position:relative;padding-block:18px 0}
.brandrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandrow img{width:34px;height:34px}
.brandrow .prod{font-family:var(--font-display);font-weight:600;font-size:15px;line-height:1.1}
.brandrow .prod small{display:block;font-family:var(--font-text);font-weight:500;font-size:12px;color:var(--band-muted)}
.brandrow .spacer{flex:1}
.access{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--band-line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--band-muted)}
.access b{color:#fff;font-weight:600}
.access i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.access.ro i{background:#f2b545}
.hero{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:26px 0 20px}
.hero h1{font-size:clamp(26px,3.4vw,38px);font-weight:600;line-height:1.08}
.hero h1 span{color:var(--accent)}
.hero p{margin:8px 0 0;color:var(--band-muted);max-width:640px}
.hero .meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--band-muted)}
.hero .meta b{display:block;font-family:var(--font-display);font-size:20px;font-weight:600;color:#fff}

/* ---------- barra fixa ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--band-1);border-bottom:1px solid var(--band-line)}
.bar .wrap{display:flex;gap:10px 18px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs a{color:var(--band-muted);text-decoration:none;font-weight:600;font-size:13.5px;padding:8px 12px;border-radius:8px;white-space:nowrap;position:relative}
.tabs a:hover{color:#fff;background:rgba(255,255,255,.06)}
.tabs a[aria-current="page"]{color:#fff;background:rgba(255,255,255,.1)}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--accent);border-radius:2px}
.parks{display:flex;gap:4px;padding:3px;border:1px solid var(--band-line);border-radius:10px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.parks::-webkit-scrollbar{display:none}
.parks button{border:0;background:transparent;color:var(--band-muted);padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer}
.parks button:hover{color:#fff}
.parks button[aria-pressed="true"]{background:#fff;color:#01032c}

/* ---------- conteúdo ---------- */
main{padding-block:22px 48px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head h2{font-size:22px;font-weight:600}
.section-head p{margin:4px 0 0;color:var(--muted);max-width:720px}
.grid{display:grid;gap:14px}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:980px){.g-3,.g-21{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.g-2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.panel h3{font-size:15px;font-weight:600}
.panel .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chamfer{border-radius:0;clip-path:polygon(var(--chanfro) 0,100% 0,100% calc(100% - var(--chanfro)),calc(100% - var(--chanfro)) 100%,0 100%,0 var(--chanfro))}
.note{font-size:12px;color:var(--muted)}
.tag-int{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag-g{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:4px;padding:1px 6px;white-space:nowrap}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi .v{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.kpi .l{font-weight:600;font-size:13px;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.meter{height:6px;border-radius:6px;background:var(--surface-3);overflow:hidden;margin-top:10px;display:flex}
.meter i{display:block;height:100%}

/* status */
.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--surface-3);gap:2px}
.sbar i{display:block;height:100%;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 0;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.legend button b{font-variant-numeric:tabular-nums;color:var(--ink)}
.legend button:hover span{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-sm);padding:2px 9px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2px 7px;font-size:11.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip.park{background:var(--brand-soft);color:var(--brand)}
.chip.alta{background:var(--danger-soft);color:var(--danger)}
.chip.media{background:var(--warn-soft);color:var(--warn)}
.chip.baixa{background:var(--surface-3);color:var(--muted)}
.chip.late{background:var(--danger);color:#fff}
.chip.ok{background:var(--accent-soft);color:var(--accent-ink)}
.chip.ghost{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}

/* park cards */
.parkcard{cursor:pointer;transition:border-color .15s,transform .15s}
.parkcard:hover{border-color:var(--brand)}
.parkcard h3{font-size:16px}
.parkcard .row{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:10px}
.parkcard .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.pct{font-family:var(--font-display);font-weight:600;font-size:26px;letter-spacing:-.02em}

/* barras horizontais */
.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 40px;gap:10px;align-items:center;font-size:12.5px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.hbar:hover span:first-child{color:var(--brand)}
@media (max-width:520px){.hbar{grid-template-columns:minmax(0,120px) minmax(0,1fr) 32px}}

/* listas */
.list{display:grid;gap:0}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%;color:inherit}
.li:first-child{border-top:0}
.li:hover .li-t{color:var(--brand)}
.li-t{font-weight:600;font-size:13.5px;line-height:1.35}
.li .grow{flex:1;min-width:0}
.li .when{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* pilares */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pillars{grid-template-columns:minmax(0,1fr)}}
.pillar{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface-2);position:relative;overflow:hidden}
.pillar .n{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--brand);letter-spacing:.06em}
.pillar h4{font-size:15px;margin-top:2px}
.pillar p{font-size:12.5px;color:var(--muted);margin:6px 0 10px}

/* próximas ações */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.lanes{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px;min-width:0}
.lane-h{display:flex;align-items:center;gap:8px;margin:2px 2px 4px}
.lane-h h3{font-size:14.5px;font-weight:600}
.lane-h .count{margin-left:auto;font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--muted)}
.lane-d{font-size:12px;color:var(--muted);margin:0 2px 10px}
.lane .mark{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;flex:none}

/* cards de ação */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:400px){.cards{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,box-shadow .15s;position:relative}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(13,234,155,.55)}100%{box-shadow:0 0 0 10px rgba(13,234,155,0)}}
.card .top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .id{font-family:var(--font-display);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.02em}
.card .t{font-weight:600;font-size:14px;line-height:1.35;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit}
.card .t:hover{color:var(--brand)}
.card .s{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.card .bottom{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.reasons{display:flex;flex-wrap:wrap;gap:4px}
.pin{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px;border-radius:4px}
.pin[aria-pressed="true"]{color:var(--brand)}

/* status select */
.ssel{position:relative;display:inline-flex;align-items:center}
.ssel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-md);padding:4px 26px 4px 24px;font-size:12.5px;font-weight:600;cursor:pointer;max-width:100%}
.ssel select:disabled{cursor:default;opacity:.85}
.ssel .sdot{position:absolute;left:10px;pointer-events:none}
.ssel::after{content:"";position:absolute;right:10px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);pointer-events:none}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 12px 8px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.fsel{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px;max-width:100%;min-width:0}
.fsel.on{border-color:var(--brand);color:var(--brand);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2);color:var(--on-brand)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:0;font-size:inherit}
.linkbtn:hover{text-decoration:underline}
.countline{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}

/* tabela */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap;z-index:1}
th button{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer;padding:0}
tbody tr:hover td{background:var(--surface-2)}
td .tt{font-weight:600;cursor:pointer}
td .tt:hover{color:var(--brand)}
.raw td,.raw th{font-size:12px;padding:6px 8px;white-space:normal;min-width:90px;max-width:340px}

/* cronograma */
.gantt{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow-x:auto}
.gantt-in{min-width:1040px;position:relative}
.g-row{display:grid;grid-template-columns:280px 1fr;border-bottom:1px solid var(--line);min-height:34px}
.g-row.head{position:sticky;top:0;background:var(--surface-2);z-index:2;min-height:44px}
.g-row.group{background:var(--surface-2);min-height:30px}
.g-row.group .g-l{font-family:var(--font-display);font-weight:600;font-size:12.5px}
.g-l{padding:7px 12px;font-size:12.5px;border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0;position:sticky;left:0;background:inherit;z-index:1}
.g-row:not(.head):not(.group) .g-l{background:var(--surface)}
.g-l .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.g-l .tt:hover{color:var(--brand)}
.g-t{position:relative}
.g-wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:10.5px;color:var(--muted);padding:4px 4px;white-space:nowrap}
.g-bar{position:absolute;top:8px;height:18px;border-radius:5px;cursor:pointer;display:flex;align-items:center;padding:0 6px;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap;min-width:8px;border:0}
.g-bar.recurring{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.22) 0 6px,transparent 6px 12px)}
.g-bar.late{outline:2px solid var(--danger);outline-offset:1px}

ções).","Alta","Recupera vendas não medidas (cookies, iOS) e melhora o Smart Bidding","Médio","Verificação manual (não visível nos dados)","Agência + site/TI","Até 06/11","A fazer"]},{"linha":5,"celulas":[2,"Aquário de São Paulo e Cidade da Criança","Automação","Recomendações > Aplicar automaticamente","Aplicação automática ativa para trocar estratégia/metas de lance: Aquário 0 tipos, Cidade da Criança 0 tipos (incl. ‘Definir ROAS/CPA desejado’; 4 mudanças automáticas em campanhas em out/26).","Desativar a aplicação automática de lances, metas e orçamento; manter só rotação de anúncios (ver aba Recomendações).","Alta","Evita mudanças de lance sem aviso às vésperas da Black Friday","Baixo","Análise da conta (não aparece nas Recomendações)","Agência","Imediato (até 30/10)","A fazer"]},{"linha":6,"celulas":[3,"Aquário de São Paulo","Estrutura (marca × genérico)","google_asp_aon-vender_search_generica-descoberta_sales_max-sales","89% do gasto de 90 dias (R$ 9.959) foi em buscas pela marca (ROAS 79) que a Institucional compra com ROAS 119. A lista de negativas de marca usada nesta campanha só tem 6 itens (e alguns em correspondência exata).","Configurações > Exclusões de marca: excluir ‘Aquário de São Paulo’ (ou ampliar a lista de negativas com frases: aquario sp, aquario sao paulo, aquário de são paulo, aquariodesp, aguario sp, acuario sao paulo). Fazer o mesmo na genérica-categoria.","Alta","A marca fica toda na Institucional; genéricas buscam público novo","Médio","Análise da conta (não aparece nas Recomendações)","Agência","Até 06/11","A fazer"]},{"linha":7,"celulas":[4,"Aquário de São Paulo","Palavras negativas","Lista ‘Padrão’","A lista ‘Padrão’ (26 negativas: grátis, vagas, trabalho, jet ski, como montar…) não está aplicada em nenhuma das 3 campanhas de Pesquisa ativas.","Biblioteca compartilhada > Listas de palavras negativas > Padrão > Aplicar às 3 campanhas de Pesquisa (revisar antes ‘ofertas’ e ‘passo’, que podem bloquear buscas de promoção).","Alta","Bloqueia /* ---------------- fluxo de status ---------------- */
function statusFlow(e, v, setModal) {
  if (v === e.status) return;
  if (!canEdit()) { toast('Seu acesso é somente para consulta.', true); return; }
  if (v === 'aplicada') return setModal({ type: 'aplicar', key: e.key });
  if (v === 'descartada') return setModal({ type: 'descartar', key: e.key });
  const ch = { status: v };
  saveTrack(e, ch, [{ tipo: 'status', de: e.status, para: v }], `${e.r.id} · ${PSHORT[e.p]}: status alterado para ${SM[v].l}.`);
}

function Evolution({ L }) {
  const keys = new Set(L.map(e => e.key));
  const ev = S.H.filter(h => h.tipo === 'status' && keys.has(h.chave));
  const start = D.registro, end = TODAY > start ? TODAY : addDays(start, 7);
  const n = Math.max(days(start, end), 7);
  const st = {}; const ptsA = [], ptsD = [];
  let i = 0;
  for (let d = 0; d <= n; d++) {
    const day = addDays(start, d);
    while (i < ev.length && isoDay(ev[i].em) <= day) { st[ev[i].chave] = ev[i].para; i++; }
    const vals = Object.values(st);
    ptsA.push(vals.filter(v => v === 'aplicada').length); ptsD.push(vals.filter(v => v === 'aplicada' || v === 'descartada').length);
  }
  const W = 520, H = 190, pl = 34, pr = 10, pt = 12, pb = 26;
  const ymax = Math.max(4, ...ptsD);
  const x = d => pl + d / n * (W - pl - pr), y = v => pt + (1 - v / ymax) * (H - pt - pb);
  const path = arr => arr.map((v, d) => `${d ? 'L' : 'M'}${x(d).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  const ticks = [0, Math.round(ymax / 2), ymax];
  const xt = [0, Math.round(n / 2), n];
  const hasData = ev.length > 0;
  return html`<svg class="chart" viewBox=${`0 0 ${W} ${H}`} role="img" aria-label="Evolução acumulada de ações concluídas e com decisão definitiva">
    ${ticks.map(t => html`<g><line x1=${pl} x2=${W - pr} y1=${y(t)} y2=${y(t)} stroke="var(--line)" /><text x=${pl - 6} y=${y(t) + 4} text-anchor="end" font-size="10.5">${t}</text></g>`)}
    ${xt.map(d => html`<text x=${x(d)} y=${H - 8} text-anchor=${d === 0 ? 'start' : d === n ? 'end' : 'middle'} font-size="10.5">${fd(addDays(start, d))}</text>`)}
    <path d=${path(ptsA) + `L${x(n)} ${y(0)}L${x(0)} ${y(0)}Z`} fill="var(--s-aplicada)" opacity=".14" />
    <path d=${path(ptsD)} fill="none" stroke="var(--s-descartada)" stroke-width="1.6" stroke-dasharray="4 3" />
    <path d=${path(ptsA)} fill="none" stroke="var(--s-aplicada)" stroke-width="2.4" />
    <circle cx=${x(n)} cy=${y(ptsA[n])} r="3.5" fill="var(--s-aplicada)" />
    ${!hasData ? html`<text x=${(W + pl) / 2} y=${H / 2 - 4} text-anchor="middle" font-size="12">As implementações aparecem aqui conforme os status forem atualizados.</text>` : null}
  </svg>
  <div class="legend" style=${{ marginTop: '4px' }}><span class="small"><span class="sdot" style=${{ background: 'var(--s-aplicada)' }}></span> Concluídas (acumulado)</span><span class="small"><span class="sdot" style=${{ background: 'var(--s-descartada)' }}></span> Com decisão definitiva</span></div>`;
}

async function downloadFile(path, filename) {
  if (window.PG_PROD) path = path.replace('.xlsx.b64.txt', '.xlsx');
  if (!S.downloads) { const a = document.createElement('a'); a.href = path; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return; }
  try {
    const r = await fetch(path); if (!r.ok) throw new Error('fetch');
    let b;
    if (path.endsWith('.b64.txt')) { const t = (await r.text()).trim(); const bin = atob(t); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); b = new Blob([u], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }); }
    else b = await r.blob();
    await S.downloads.save({ filename, data: b });
  }
  catch (e) { if (!e || e.code !== 'declined') toast('Não foi possível baixar o arquivo agora.', true); }
}

        <div class="stepper">${FLOW.map((s, i) => { const ci = FLOW.indexOf(e.status); const cur = e.status === s; return html`<button class=${'step' + (cur ? ' cur' : ci > i ? ' done' : '')} style=${cur ? { background: SM[s].c, color: (s === 'aplicada' || s === 'analise') ? '#01032c' : '#fff' } : null} disabled=${!ed || cur} onClick=${() => onStatus(e, s)}>${SM[s].l}</button>`; })}</div>
        <div style=${{ display: 'flex', justifyContent: 'space-between', gap: '8px', marginTop: '10px', flexWrap: 'wrap', alignItems: 'center' }}>
          <span class="small muted">${e.status === 'descartada' ? html`<b style=${{ color: 'var(--ink)' }}>Descartada.</b> Motivo: ${e.motivoDescarte || '—'}` : e.status === 'aplicada' ? html`<b style=${{ color: 'var(--accent-ink)' }}>Concluída em ${fdy(e.dataConclusao)}.</b>` : lane ? html`Em Próximas ações: <b>${LM[lane].l}</b>` : ''}</span>
          ${ed && e.status !== 'descartada' ? html`<button class="btn sm danger" onClick=${() => onStatus(e, 'descartada')}>Descartar ação</button>` : null}
          ${ed && e.status === 'descartada' ? html`<button class="btn sm" onClick=${() => onStatus(e, 'pendente')}>Reabrir</button>` : null}
        </div></section>

      <section class="d-sec"><h3>Recomendação do Google × decisão da equipe</h3>
        <div class="gvt">
          <div class="g"><h4>Recomendação do Google</h4>
            <p style=${{ margin: '0 0 8px', fontSize: '13.5px' }}>${r.resumo}</p>
            <dl class="kv" style=${{ gridTemplateColumns: '92px 1fr' }}><dt>Objetivo</dt><dd>${r.objetivo}</dd>${r.impacto && r.impacto !== r.objetivo ? html`<dt>Impacto</dt><dd>${r.impacto}</dd>` : null}<dt>Fonte</dt><dd>${r.origem}${r.linha ? `, linha ${r.linha}` : ''}</dd>${r.fonteGoogle && r.fonte === 'Planilha' ? html`<dt>Origem</dt><dd>${r.fonteGoogle}</dd>` : null}</dl>
            ${r.contexto ? html`<p class="small" style=${{ margin: '8px 0 0', color: 'var(--ink-2)' }}><b>Contexto:</b> ${r.contexto}</p>` : null}
          </div>
          <div class="e"><h4>Decisão da equipe</h4>
            <div class="field"><label for="dec">Como vamos tratar</label>
              <select id="dec" disabled=${!ed} value=${e.decisao} onChange=${ev => { const v = ev.target.value; ev.target.value = e.decisao; if (v === 'adaptada' || v === 'nao') setModal({ type: 'decisao', key: e.key, dec: v }); else saveTrack(e, { decisao: v, decisaoNota: '', decisaoMotivo: '' }, [{ tipo: 'decisao', de: e.decisao, para: v }], 'Decisão registrada.'); }}>${DEC.map(d => html`<option value=${d.id}>${d.l}</option>`)}</select></div>
            ${e.decisaoNota ? html`<p class="small" style=${{ margin: '8px 0 0' }}><b>O que muda:</b> ${e.decisaoNota}</p>` : null}
            ${e.decisaoMotivo ? html`<p class="small" style=${{ margin: '4px 0 0' }}><b>Motivo:</b> ${e.decisaoMotivo}</p>` : null}
            ${ed && (e.decisao === 'adaptada' || e.decisao === 'nao') ? html`<button class="linkbtn small" style=${{ marginTop: '6px' }} onClick=${() => setModal({ type: 'decisao', key: e.key, dec: e.decisao })}>Editar justificativa</button>` : null}
            <p class="tiny muted" style=${{ margin: '8px 0 0' }}>Decisão e status são independentes.</p>
          </div>
        </div>
        <details class="orig"><summary>Ver registro original ${r.fonte === 'Planilha' ? '(planilha do Google)' : r.fonte === 'Apresentação' ? '(apresentação do Google)' : ''}</summary>
          <dl class="kv" style=${{ marginTop: '10px' }}>${Object.entries(r.original || {}).map(([k, v]) => html`<dt>${k}</dt><dd>${v === '' ? '—' : String(v)}</dd>`)}</dl>
          ${r.fonte === 'Planilha' ? html`<button class="linkbtn small" style=${{ marginTop: '8px' }} onClick=${() => setViewer({ type: 'sheet', sheet: 'Plano de ação', row: r.linha })}>Abrir na planilha original</button>` : r.fonte === 'Apresentação' ? html`<button class="linkbtn small" style=${{ marginTop: '8px' }} onClick=${() => setViewer({ type: 'pdf', page: r.origem.includes('34') ? 34 : 29 })}>Abrir na apresentação</button>` : null}
        </details></section>

      <section class="d-sec"><h3>Execução</h3>
        <div class="two">
          <div class="field"><label for="resp">Responsável</label><input id="resp" list="resp-list" disabled=${!ed} value=${resp} onInput=${ev => setResp(ev.target.value)} onBlur=${() => { if (resp !== (e.responsavel || '')) set('responsavel', 'Responsável', resp.trim()); }} /><datalist id="resp-list">${respOpts.map(o => html`<option value=${o} />`)}</datalist><span class="tiny muted">Indicado pelo Google: ${r.responsavel || '—'}${r.respSugerido ? ' (sugestão interna)' : ''}</span></div>
          <div class="field"><span class="lab">Prazo do Google</span><div style=${{ padding: '7px 0', fontSize: '13.5px' }}>${r.prazoTexto || '—'}</div></div>
          <div class="field"><label for="ini">Início planejado ${r.prazoSugerido ? html`<span class="tag-int">Sugestão interna</span>` : null}</label><input id="ini" type="date" disabled=${!ed} value=${e.inicio} onChange=${ev => ev.target.value && set('inicio', 'Início planejado', ev.target.value, fdy)} /></div>
          <div class="field"><label for="prz">Prazo planejado ${e.prazoAlterado ? html`<span class="tag-int">Replanejado</span>` : r.prazoSugerido ? html`<span class="tag-int">Sugestão interna</span>` : null}</label><input id="prz" type="date" disabled=${!ed} value=${e.prazo} onChange=${ev => ev.target.value && set('prazo', 'Prazo planejado', ev.target.value, fdy)} />${e.late ? html`<span class="tiny" style=${{ color: 'var(--danger)', fontWeight: 600 }}>Prazo expirado: defina uma nova data.</span>` : null}</div>
          <div class="field"><label for="pe">Prioridade da equipe <span class="tag-int">Avaliação interna</span></label><select id="pe" disabled=${!ed} value=${e.prioEquipe} onChange=${ev => set('prioridadeEquipe', 'Prioridade da equipe', ev.target.value, x => x || `Seguir ${r.prioridade ? 'Google (' + r.prioridade + ')' : 'sugestão'}`)}><option value="">${r.prioridade ? `Seguir o Google (${r.prioridade})` : 'Seguir sugestão'}</option><option>Alta</option><option>Média</option><option>Baixa</option></select></div>
          <div class="field"><label for="imp">Impacto estimado <span class="tag-int">Avaliação interna</span></label><select id="imp" disabled=${!ed} value=${e.impactoNivel} onChange=${ev => set('impactoNivel', 'Impacto estimado', ev.target.value)}><option>Alto</option><option>Médio</option><option>Baixo</option></select></div>
          <div class="field"><span class="lab">Complexidade (esforço)</span><div style=${{ padding: '7px 0', fontSize: '13.5px' }}>${e.esforco ? e.esforco + ' — definido pelo Google' : 'Não informado pela fonte'}</div></div>
          <div class="field"><label for="ln">Posição em Próximas ações</label><select id="ln" disabled=${!ed} value=${e.grupoManual} onChange=${ev => set('grupoManual', 'Posição em Próximas ações', ev.target.value, x => x ? LM[x].l : 'Automática')}><option value="">Automática</option>${LANES.map(l => html`<option value=${l.id}>${l.l}</option>`)}</select></div>
        </div>
        ${deps.length || r.validacao || rels.length || dependents.length ? html`<div style=${{ marginTop: '12px', display: 'grid', gap: '8px' }}>
          ${deps.length ? html`<div class="small"><b>Depende de</b> <span class="tag-int">Avaliação interna</span><div style=${{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>${deps.map(d => html`<button class="pill" style=${{ cursor: 'pointer' }} onClick=${() => setSel(d.key)}><${SDot} s=${d.status} />${d.r.id} · ${d.r.titulo.slice(0, 48)}${d.r.titulo.length > 48 ? '…' : ''}</button>`)}</div></div>` : null}
          ${dependents.length ? html`<div class="small"><b>Libera</b><div style=${{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>${dependents.map(d => html`<button class="pill" style=${{ cursor: 'pointer' }} onClick=${() => setSel(d.key)}><${SDot} s=${d.status} />${d.r.id}</button>`)}</div></div>` : null}
          ${rels.length ? html`<div class="small"><b>Relacionadas</b><div style=${{ display: 'flex', gap: '6px', flexWrap: 'wrap', marginTop: '4px' }}>${rels.map(d => html`<button class="pill" style=${{ cursor: 'pointer' }} onClick=${() => setSel(d.key)}><${SDot} s=${d.status} />${d.r.id}</button>`)}</div></div>` : null}
          ${r.validacao ? html`<label class="small" style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="checkbox" disabled=${!ed} checked=${e.validacaoOk} onChange=${ev => saveTrack(e, { validacaoOk: ev.target.checked }, [{ tipo: 'campo', campo: 'Validação', de: e.validacaoOk ? 'Concluída' : 'Pendente', para: ev.target.checked ? 'Concluída' : 'Pendente', nota: r.validacao }], ev.target.checked ? 'Validação marcada como concluída.' : 'Validação reaberta.')} /><span><b>Requer:</b> ${r.validacao} — ${e.validacaoOk ? 'concluída' : 'pendente'}</span></label>` : null}
        </div>` : null}
        <div class="field" style=${{ marginTop: '12px' }}><label for="obs">Observações</label><textarea id="obs" disabled=${!ed} value=${obs} onInput=${ev => setObs(ev.target.value)} placeholder="Anotações da equipe sobre esta ação"></textarea>
          ${ed && obs !== e.obs ? html`<div><button class="btn sm primary" onClick=${() => saveTrack(e, { observacoes: obs }, [{ tipo: 'campo', campo: 'Observações', de: e.obs ? 'texto anterior' : '—', para: 'atualizadas', nota: obs.slice(0, 280) }], 'Observações salvas.')}>Salvar observações</button></div>` : null}</div>
      </section>

      <section class="d-sec"><h3>Evidências <span class="muted" style=${{ textTransform: 'none', letterSpacing: 0 }}>${evs.length || ''}</span>${ed ? html`<button class="btn sm" style=${{ marginLeft: 'auto' }} onClick=${() => setModal({ type: 'evidencia', key: e.key })}>${I.plus} Adicionar</button>` : null}</h3>
        ${evs.length ? evs.map(v => html`<div class="ev">${v.assetId && /^image\//.test(v.contentType || '') ? html`<a href=${pgBlobUrl(v.assetId)} target="_blank" rel="noopener"><img src=${pgBlobUrl(v.assetId)} alt=${v.titulo} /></a>` : html`<span class="ico">${v.tipo === 'link' ? I.link : v.tipo === 'comentario' ? I.note : I.file}</span>`}
          <div style=${{ minWidth: 0 }}><div style=${{ fontWeight: 600 }}>${v.url ? html`<a href=${v.url} target="_blank" rel="noopener" style=${{ color: 'var(--brand)', overflowWrap: 'anywhere' }}>${v.titulo || v.url}</a>` : v.assetId ? html`<a href=${pgBlobUrl(v.assetId)} target="_blank" rel="noopener" style=${{ color: 'var(--brand)' }}>${v.titulo || v.arquivoNome}</a>` : v.titulo}</div>
            ${v.descricao ? html`<div class="small" style=${{ whiteSpace: 'pre-wrap' }}>${v.descricao}</div>` : null}
            <div class="tiny muted">${v.dataImplementacao ? 'Implementado em ' + fdy(v.dataImplementacao) + ' · ' : ''}${who(v.por)} · ${fdt(v.em)}${ed ? html` · <button class="linkbtn tiny" onClick=${() => setModal({ type: 'confirm', title: 'Remover evidência?', text: 'A evidência deixa de aparecer, mas a remoção fica registrada no histórico.', ok: 'Remover', run: async () => { try { if (S.db) await S.db.doc('evidencias/' + v.id).update({ removida: true, removidaEm: new Date().toISOString(), removidaPor: S.me.id || null }); else { v.removida = true; } await addDoc('historico', { tipo: 'evidencia', para: 'removida', nota: v.titulo || '', chave: e.key, acao: r.id, parque: e.p, em: new Date().toISOString(), por: S.me.id || null }); toast('Evidência removida.'); refresh(); } catch (err) { handleErr(err); } } })}>remover</button>` : null}</div></div></div>`)
        : html`<p class="small muted" style=${{ margin: 0 }}>Registre links de campanhas, capturas de tela, documentos e comentários técnicos que comprovem a implementação.</p>`}
      </section>

      ${ap.length ? html`<section class="d-sec"><h3>Dados de apoio da planilha</h3>${ap.map(a => html`<details class="orig" style=${{ marginTop: 0, marginBottom: '8px' }}><summary>${a.aba}${a.titulo ? ' › ' + a.titulo : ''} · ${a.rows.length} linha${a.rows.length > 1 ? 's' : ''} de ${PSHORT[e.p]}</summary>
        <div class="tablewrap raw" style=${{ marginTop: '8px', maxHeight: '320px' }}><table><thead><tr>${a.cab.slice(1).map(h => html`<th>${h}</th>`)}</tr></thead><tbody>${a.rows.map(l => html`<tr>${a.cab.slice(1).map((_, i) => html`<td>${fmtCell(l.celulas[i + 1] ?? '')}</td>`)}</tr>`)}</tbody></table></div></details>`)}</section>` : null}

      <section class="d-sec"><h3>Histórico</h3>
        <div class="hist">
          ${hist.map(h => html`<div class="h-it"><span class="d" style=${{ background: h.tipo === 'status' && SM[h.para] ? SM[h.para].c : 'var(--brand)' }}></span><div><div class="small" style=${{ fontWeight: 600 }}>${histText(h)}</div>${h.nota && h.tipo !== 'evidencia' ? html`<div class="small" style=${{ color: 'var(--ink-2)', whiteSpace: 'pre-wrap' }}>${h.nota}</div>` : null}<div class="w">${fdt(h.em)} · ${who(h.por)}</div></div></div>`)}
          <div class="h-it"><span class="d" style=${{ background: 'var(--muted)' }}></span><div><div class="small" style=${{ fontWeight: 600 }}>${r.fonte === 'Equipe' ? 'Recomendação cadastrada pela equipe' : `Recomendação registrada a partir da ${r.fonte === 'Planilha' ? 'planilha do Google (dados de 28/10/2026)' : 'apresentação do Google de 27/10/2026'}`}</div><div class="w">${r.fonte === 'Equipe' ? fdt(r.criadoEm) : fdy(D.registro)} · ${r.fonte === 'Equipe' ? who(r.por) : 'Sistema'}</div></div></div>
        </div>
        <dl class="kv" style=${{ marginTop: '6px', fontSize: '12px' }}><dt>Data de criação</dt><dd>${r.fonte === 'Equipe' ? fdt(r.criadoEm) : fdy(D.registro)}</dd><dt>Última atualização</dt><dd>${e.atualizadoEm ? fdt(e.atualizadoEm) + ' · ' + who(e.t.atualizadoPor) : 'Sem alterações'}</dd></dl>
      </section>
    </div>
  </aside>`;
}

/* ---------------- Modais ---------------- */
function Modal({ m, close, M }) {
  const e = m.key ? M.map[m.key] : null;
  const [f, setF] = useState(() => ({ data: TODAY, obs: '', motivo: '', nota: '', tipo: 'link', titulo: '', url: '', descricao: '', file: null, categoria: 'Atualização', parques: ['ASP', 'ANI', 'CDC'], prioridade: 'Média', esforco: 'Médio', responsavel: 'Agência', prazo: addDays(TODAY, 7), resumo: '', cat: '', origem: '', comEvid: false }));
  const [busy, setBusy] = useState(false);
  const up = (k, v) => setF(x => ({ ...x, [k]: v }));
  const run = async fn => { if (busy) return; setBusy(true); try { const ok = await fn(); if (ok !== false) close(); } finally { setBusy(false); } };
  const fileInput = html`<div class="field"><label for="m-file">Arquivo ou captura de tela</label><input id="m-file" type="file" accept="image/*,application/pdf,text/csv,text/plain" onChange=${ev => up('file', ev.target.files[0] || null)} /><span class="tiny muted">Imagens, PDF, CSV ou texto, até 20 MB.</span></div>`;
  async function uploadIf() { if (!f.file) return {}; if (!S.assets) { toast('O envio de arquivos exige acesso de edição completa. Use um link.', true); throw { code: 'no_assets' }; } const res = await S.assets.upload(f.file); return { assetId: res.id, arquivoNome: f.file.name, contentType: res.contentType }; }
  const evTypes = [['link', 'Link (campanha, documento)'], ['arquivo', 'Captura de tela ou arquivo'], ['comentario', 'Comentário técnico']].filter(([v]) => v !== 'arquivo' || S.assets);
  async function saveEvidence(target) {
    const fileMeta = f.tipo === 'arquivo' ? await uploadIf() : {};
    const now = new Date().toISOString();
    const body = { chave: target.key, acao: target.r.id, parque: target.p, tipo: f.tipo, titulo: f.titulo.trim() || (f.tipo === 'link' ? f.url : f.tipo === 'arquivo' ? (f.file && f.file.name) : 'Comentário técnico'), url: f.tipo === 'link' ? f.url.trim() : '', descricao: f.descricao.trim(), dataImplementacao: f.data || '', em: now, por: S.me.id || null, ...fileMeta };
    await addDoc('evidencias', body);
    await addDoc('historico', { tipo: 'evidencia', para: 'adicionada', nota: body.titulo, chave: target.key, acao: target.r.id, parque: target.p, em: now, por: S.me.id || null });
  }
  const evOk = f.tipo === 'link' ? /^https?:\/\//i.test(f.url.trim()) : f.tipo === 'arquivo' ? !!f.file : f.descricao.trim().length > 3;
  const EvFields = html`<div class="field"><label for="m-tipo">Tipo de evidência</label><select id="m-tipo" value=${f.tipo} onChange=${ev => up('tipo', ev.target.value)}>${evTypes.map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></div>
    <div class="field"><label for="m-tit">Título</label><input id="m-tit" value=${f.titulo} onInput=${ev => up('titulo', ev.target.value)} placeholder="Ex.: Campanha Institucional com nova estratégia" /></div>
    ${f.tipo === 'link' ? html`<div class="field"><label for="m-url">Link</label><input id="m-url" type="url" value=${f.url} onInput=${ev => up('url', ev.target.value)} placeholder="https://ads.google.com/…" /></div>` : null}
    ${f.tipo === 'arquivo' ? fileInput : null}
    <div class="field"><label for="m-desc">Descrição dos ajustes realizados</label><textarea id="m-desc" value=${f.descricao} onInput=${ev => up('descricao', ev.target.value)}></textarea></div>`;
  let body = null;
  if (m.type === 'aplicar') body = html`<h3>Marcar como concluída</h3><p class="small muted">${e.r.id} · ${PN[e.p]} — ${e.r.titulo}</p>
    <div class="grid" style=${{ gap: '10px', marginTop: '10px' }}>
      <div class="field"><label for="m-data">Data de conclusão</label><input id="m-data" type="date" value=${f.data} onInput=${ev => up('data', ev.target.value)} /></div>
      <div class="field"><label for="m-obs">Observações</label><textarea id="m-obs" value=${f.obs} onInput=${ev => up('obs', ev.target.value)} placeholder="O que foi feito e onde"></textarea></div>
      <label class="small" style=${{ display: 'flex', gap: '8px', alignItems: 'center' }}><input type="checkbox" checked=${f.comEvid} onChange=${ev => up('comEvid', ev.target.checked)} />Registrar uma evidência agora</label>
      ${f.comEvid ? EvFields : null}</div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${!f.data || busy || (f.comEvid && !evOk)} onClick=${() => run(async () => { const ok = await saveTrack(e, { status: 'aplicada', dataConclusao: f.data, ...(f.obs.trim() ? { observacoes: (e.obs ? e.obs + '\n' : '') + f.obs.trim() } : {}) }, [{ tipo: 'status', de: e.status, para: 'aplicada', nota: `Concluída em ${fdy(f.data)}${f.obs.trim() ? ' — ' + f.obs.trim() : ''}` }], `${e.r.id} · ${PSHORT[e.p]} marcada como aplicada.`); if (ok && f.comEvid) { try { await saveEvidence(e); } catch (err) { if (err.code !== 'no_assets') handleErr(err); } } return ok; })}>Confirmar aplicação</button></div>`;
  if (m.type === 'descartar') body = html`<h3>Descartar ação</h3><p class="small muted">${e.r.id} · ${PN[e.p]} — ${e.r.titulo}</p><p class="small">A ação continua disponível para consulta, com todo o histórico.</p>
    <div class="field"><label for="m-mot">Motivo da decisão (obrigatório)</label><textarea id="m-mot" value=${f.motivo} onInput=${ev => up('motivo', ev.target.value)} placeholder="Ex.: estratégia, orçamento, objetivo comercial ou limitação operacional"></textarea></div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${f.motivo.trim().length < 5 || busy} onClick=${() => run(() => saveTrack(e, { status: 'descartada', motivoDescarte: f.motivo.trim() }, [{ tipo: 'status', de: e.status, para: 'descartada', nota: 'Motivo: ' + f.motivo.trim() }], `${e.r.id} · ${PSHORT[e.p]} descartada.`))}>Descartar</button></div>`;
  if (m.type === 'decisao') { const isA = m.dec === 'adaptada';
    body = html`<h3>${DM[m.dec].l}</h3><p class="small muted">${e.r.id} · ${PN[e.p]} — ${e.r.titulo}</p>
    <div class="grid" style=${{ gap: '10px', marginTop: '10px' }}>
      ${isA ? html`<div class="field"><label for="m-nota">O que muda em relação à recomendação do Google</label><textarea id="m-nota" value=${f.nota || e.decisaoNota} onInput=${ev => up('nota', ev.target.value)}></textarea></div>` : null}
      <div class="field"><label for="m-mot2">Motivo</label><textarea id="m-mot2" value=${f.motivo || e.decisaoMotivo} onInput=${ev => up('motivo', ev.target.value)} placeholder="Estratégia, orçamento, objetivos comerciais, limitações operacionais…"></textarea></div></div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${busy || (f.motivo || e.decisaoMotivo).trim().length < 5 || (isA && (f.nota || e.decisaoNota).trim().length < 5)} onClick=${() => run(() => { const nota = (f.nota || e.decisaoNota).trim(), mot = (f.motivo || e.decisaoMotivo).trim(); return saveTrack(e, { decisao: m.dec, decisaoNota: isA ? nota : '', decisaoMotivo: mot }, [{ tipo: 'decisao', de: e.decisao, para: m.dec, nota: (isA ? 'O que muda: ' + nota + '\n' : '') + 'Motivo: ' + mot }], 'Decisão registrada.'); })}>Registrar decisão</button></div>`; }
  if (m.type === 'evidencia') body = html`<h3>Adicionar evidência</h3><p class="small muted">${e.r.id} · ${PN[e.p]} — ${e.r.titulo}</p>
    <div class="grid" style=${{ gap: '10px', marginTop: '10px' }}>${EvFields}<div class="field"><label for="m-di">Data da implementação</label><input id="m-di" type="date" value=${f.data} onInput=${ev => up('data', ev.target.value)} /></div></div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${!evOk || busy} onClick=${() => run(async () => { try { await saveEvidence(e); toast('Evidência adicionada.'); return true; } catch (err) { if (err.code !== 'no_assets') handleErr(err); return false; } })}>${busy ? 'Enviando…' : 'Adicionar evidência'}</button></div>`;
  if (m.type === 'material') { const ok = f.titulo.trim() && (f.tipo === 'link' ? /^https?:\/\//i.test(f.url.trim()) : !!f.file);
    body = html`<h3>Adicionar material</h3>
    <div class="grid" style=${{ gap: '10px', marginTop: '10px' }}>
      <div class="field"><label for="mm-t">Título</label><input id="mm-t" value=${f.titulo} onInput=${ev => up('titulo', ev.target.value)} placeholder="Ex.: Atualização do Google — 15/11" /></div>
      <div class="two"><div class="field"><label for="mm-c">Categoria</label><select id="mm-c" value=${f.categoria} onChange=${ev => up('categoria', ev.target.value)}>${['Atualização', 'Apresentação', 'Planilha', 'Ata de reunião', 'Evidência geral', 'Outro'].map(c => html`<option>${c}</option>`)}</select></div>
      <div class="field"><label for="mm-d">Data</label><input id="mm-d" type="date" value=${f.data} onInput=${ev => up('data', ev.target.value)} /></div></div>
      <div class="field"><label for="mm-k">Formato</label><select id="mm-k" value=${f.tipo === 'comentario' ? 'link' : f.tipo} onChange=${ev => up('tipo', ev.target.value)}><option value="link">Link</option>${S.assets ? html`<option value="arquivo">Arquivo</option>` : null}</select></div>
      ${f.tipo === 'arquivo' ? fileInput : html`<div class="field"><label for="mm-u">Link</label><input id="mm-u" type="url" value=${f.url} onInput=${ev => up('url', ev.target.value)} placeholder="https://…" /></div>`}
      <div class="field"><label for="mm-ds">Descrição</label><input id="mm-ds" value=${f.descricao} onInput=${ev => up('descricao', ev.target.value)} /></div></div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${!ok || busy} onClick=${() => run(async () => { try { const meta = f.tipo === 'arquivo' ? await uploadIf() : {}; await addDoc('materiais', { titulo: f.titulo.trim(), categoria: f.categoria, data: f.data, url: f.tipo === 'link' ? f.url.trim() : (meta.assetId ? pgBlobUrl(meta.assetId) : ''), descricao: f.descricao.trim(), em: new Date().toISOString(), por: S.me.id || null, ...meta }); toast('Material adicionado.'); return true; } catch (err) { if (err.code !== 'no_assets') handleErr(err); return false; } })}>Adicionar</button></div>`; }
  if (m.type === 'nova') { const cats = [...new Set(M.all.map(x => x.r.categoria))].sort(); const ok = f.titulo.trim().length > 4 && f.parques.length && f.cat.trim();
    body = html`<h3>Nova recomendação</h3><p class="small muted">Para recomendações recebidas depois de 27/10 (novas reuniões, e-mails ou atualizações do Google).</p>
    <div class="grid" style=${{ gap: '10px', marginTop: '10px' }}>
      <div class="field"><label for="n-t">Título</label><input id="n-t" value=${f.titulo} onInput=${ev => up('titulo', ev.target.value)} /></div>
      <div class="field"><label for="n-r">Recomendação (texto original)</label><textarea id="n-r" value=${f.resumo} onInput=${ev => up('resumo', ev.target.value)}></textarea></div>
      <div class="field"><span class="lab">Parques</span><div style=${{ display: 'flex', gap: '12px', flexWrap: 'wrap' }}>${PK.map(p => html`<label class="small" style=${{ display: 'flex', gap: '6px', alignItems: 'center' }}><input type="checkbox" checked=${f.parques.includes(p)} onChange=${ev => up('parques', ev.target.checked ? [...f.parques, p] : f.parques.filter(x => x !== p))} />${PN[p]}</label>`)}</div></div>
      <div class="two"><div class="field"><label for="n-c">Categoria</label><input id="n-c" list="n-cats" value=${f.cat} onInput=${ev => up('cat', ev.target.value)} /><datalist id="n-cats">${cats.map(c => html`<option value=${c} />`)}</datalist></div>
      <div class="field"><label for="n-o">Origem</label><input id="n-o" value=${f.origem} onInput=${ev => up('origem', ev.target.value)} placeholder="Ex.: E-mail do Google, 12/11" /></div>
      <div class="field"><label for="n-p">Prioridade</label><select id="n-p" value=${f.prioridade} onChange=${ev => up('prioridade', ev.target.value)}><option>Alta</option><option>Média</option><option>Baixa</option></select></div>
      <div class="field"><label for="n-e">Esforço</label><select id="n-e" value=${f.esforco} onChange=${ev => up('esforco', ev.target.value)}><option>Baixo</option><option>Médio</option><option>Alto</option></select></div>
      <div class="field"><label for="n-rs">Responsável</label><input id="n-rs" value=${f.responsavel} onInput=${ev => up('responsavel', ev.target.value)} /></div>
      <div class="field"><label for="n-pz">Prazo</label><input id="n-pz" type="date" value=${f.prazo} onInput=${ev => up('prazo', ev.target.value)} /></div></div></div>
    <div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${!ok || busy} onClick=${() => run(async () => {
      const used = new Set(S.C.map(c => c.id)); let n = S.C.length + 1, id; do { id = 'NV-' + pad(n++); } while (used.has(id));
      const now = new Date().toISOString();
      const doc = { id, titulo: f.titulo.trim(), resumo: f.resumo.trim(), objetivo: '', parques: f.parques, parqueTexto: f.parques.length === 3 ? 'Todos os parques' : f.parques.map(p => PN[p]).join(' e '), categoria: f.cat.trim(), prioridade: f.prioridade, esforco: f.esforco, responsavel: f.responsavel.trim(), prazoTexto: 'Até ' + fd(f.prazo), inicio: TODAY, prazo: f.prazo, prazoSugerido: false, recorrente: false, origemTexto: f.origem.trim(), criadoEm: now, por: S.me.id || null };
      try { if (S.db) await S.db.doc('recsCustom/' + id).set(doc); else await addDoc('recsCustom', doc); for (const p of f.parques) await addDoc('historico', { tipo: 'criacao', chave: id + '_' + p, acao: id, parque: p, em: now, por: S.me.id || null }); toast(`${id} cadastrada.`); return true; } catch (err) { handleErr(err); return false; } })}>Cadastrar</button></div>`; }
  if (m.type === 'confirm') body = html`<h3>${m.title}</h3><p class="small">${m.text}</p><div class="acts"><button class="btn" onClick=${close}>Cancelar</button><button class="btn primary" disabled=${busy} onClick=${() => run(m.run)}>${m.ok}</button></div>`;
  return html`<div class="scrim top" onClick=${close}></div><div class="modal" role="dialog" aria-modal="true">${body}</div>`;
}

const root = document.getElementById('central'); root.textContent = '';
render(html`<${App} />`, root);
};
</script>
<script>(function () {
  var sets = [
    ['https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js'],
    ['https://cdn.jsdelivr.net/npm/preact@10.19.3/dist/preact.umd.js', 'https://cdn.jsdelivr.net/npm/preact@10.19.3/hooks/dist/hooks.umd.js', 'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js'],
    ['https://unpkg.com/htm@3.1.1/preact/standalone.umd.js']
  ];
  function load(src) { return new Promise(function (res, rej) { var s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
  function lib() {
    if (window.htmPreact && window.htmPreact.useState) return window.htmPreact;
    if (window.preact && window.preactHooks && window.htm) return Object.assign({}, window.preact, window.preactHooks, { html: window.htm.bind(window.preact.h) });
    return null;
  }
  (async function () {
    for (var i = 0; i < sets.length; i++) {
      try { for (var j = 0; j < sets[i].length; j++) await load(sets[i][j]); } catch (e) { continue; }
      var l = lib(); if (l) { try { window.__startCentral(l); } catch (e) { console.error(e); document.getElementById('central').textContent = 'Erro ao iniciar a Central: ' + e.message; } return; }
    }
    document.getElementById('central').textContent = 'Não foi possível carregar a Central. Verifique a conexão e recarregue a página.';
  })();
})();
</script>
